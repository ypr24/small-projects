
<!DOCTYPE html>
<html>
<head>
    <title>My Counter dApp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            color: #1f2937;
        }

        #counter {
            font-size: 50px;
            margin: 30px;
        }

        button {
            padding: 12px 24px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        #status {
            margin-top: 25px;
        }

        #block-explorer {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        #block-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        #block-number {
            width: 180px;
            padding: 11px;
            font-size: 16px;
        }

        #block-list {
            display: grid;
            gap: 12px;
            text-align: left;
        }

        .block {
            padding: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #f9fafb;
            overflow-wrap: anywhere;
        }

        .block h3 {
            margin: 0 0 8px;
        }

        .block p {
            margin: 5px 0;
        }

        .muted {
            color: #6b7280;
        }
    </style>
</head>

<body>

    <h1>My Counter dApp</h1>

    <div id="counter">Loading...</div>

    <button id="connect">
        Connect Wallet
    </button>

    <button id="increment">
        Increment
    </button>

    <button id="refresh">
        Refresh
    </button>

    <p id="account"></p>
    <p id="status"></p>

    <section id="block-explorer">
        <h2>Local Blockchain Blocks</h2>
        <p id="block-summary" class="muted">Loading blocks...</p>

        <div id="block-controls">
            <input id="block-number" type="number" min="0" step="1" placeholder="Block number">
            <button id="view-block">View Block</button>
            <button id="view-all-blocks">Refresh All Blocks</button>
        </div>

        <div id="selected-block"></div>
        <div id="block-list"></div>
    </section>


    <script type="module">

        // Import ethers.js
        import { ethers } from
            "https://cdn.jsdelivr.net/npm/ethers@6/+esm";


        // Your local Anvil blockchain
        const RPC_URL =
            "http://127.0.0.1:8545";


        // Your Counter contract
        const CONTRACT_ADDRESS =
            "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512";


        // ABI = functions from Counter that our frontend needs
        const ABI = [
            "function number() view returns (uint256)",
            "function increment()"
        ];


        // ------------------------------------------------
        // READ FROM BLOCKCHAIN
        // Equivalent to:
        //
        // cast call ADDRESS "number()(uint256)"
        // ------------------------------------------------

        const provider =
            new ethers.JsonRpcProvider(RPC_URL);


        const contract =
            new ethers.Contract(
                CONTRACT_ADDRESS,
                ABI,
                provider
            );


        async function getCounter() {

            try {

                const value =
                    await contract.number();

                document.getElementById("counter")
                    .innerText = value.toString();

                document.getElementById("status")
                    .innerText = "Counter loaded";

            } catch (error) {

                console.error(error);

                document.getElementById("status")
                    .innerText =
                    "Could not connect to blockchain";

            }
        }


        // ------------------------------------------------
        // CONNECT WALLET
        // ------------------------------------------------

        async function connectWallet() {

            try {

                if (!window.ethereum) {

                    alert(
                        "Please install a browser wallet such as MetaMask"
                    );

                    return;
                }


                // Ask wallet to connect
                await window.ethereum.request({
                    method: "eth_requestAccounts"
                });


                const browserProvider =
                    new ethers.BrowserProvider(
                        window.ethereum
                    );


                const signer =
                    await browserProvider.getSigner();


                const address =
                    await signer.getAddress();


                document.getElementById("account")
                    .innerText =
                    "Connected: " + address;


                document.getElementById("status")
                    .innerText =
                    "Wallet connected";


            } catch (error) {

                console.error(error);

                document.getElementById("status")
                    .innerText =
                    "Wallet connection failed";
            }
        }


        // ------------------------------------------------
        // INCREMENT
        //
        // Equivalent to:
        //
        // cast send ADDRESS "increment()"
        // ------------------------------------------------

        async function incrementCounter() {

            try {

                if (!window.ethereum) {

                    alert(
                        "Please install a browser wallet"
                    );

                    return;
                }


                // Connect ethers.js to the browser wallet
                const browserProvider =
                    new ethers.BrowserProvider(
                        window.ethereum
                    );


                // Get the wallet that will sign the transaction
                const signer =
                    await browserProvider.getSigner();


                // Connect contract to the signer
                const contractWithSigner =
                    new ethers.Contract(
                        CONTRACT_ADDRESS,
                        ABI,
                        signer
                    );


                document.getElementById("status")
                    .innerText =
                    "Waiting for wallet approval...";


                // Send transaction
                const tx =
                    await contractWithSigner.increment();


                document.getElementById("status")
                    .innerText =
                    "Transaction sent: " + tx.hash;


                // Wait for Anvil to mine it
                await tx.wait();


                document.getElementById("status")
                    .innerText =
                    "Transaction mined!";


                // Read the new value
                await getCounter();


            } catch (error) {

                console.error(error);

                document.getElementById("status")
                    .innerText =
                    "Transaction failed";
            }
        }


        function formatTimestamp(timestamp) {
            return new Date(Number(timestamp) * 1000).toLocaleString();
        }


        function renderBlock(block, container) {
            if (!block) {
                container.innerHTML = '<p class="muted">Block not found.</p>';
                return;
            }

            container.innerHTML = `
                <article class="block">
                    <h3>Block #${block.number}</h3>
                    <p><strong>Hash:</strong> ${block.hash}</p>
                    <p><strong>Parent hash:</strong> ${block.parentHash}</p>
                    <p><strong>Timestamp:</strong> ${formatTimestamp(block.timestamp)}</p>
                    <p><strong>Transactions:</strong> ${block.transactions.length}</p>
                </article>
            `;
        }


        async function viewBlockByNumber() {
            const input = document.getElementById("block-number");
            const blockNumber = Number(input.value);
            const selectedBlock = document.getElementById("selected-block");

            if (!Number.isInteger(blockNumber) || blockNumber < 0) {
                selectedBlock.innerHTML = '<p class="muted">Enter a non-negative block number.</p>';
                return;
            }

            try {
                const latestBlock = await provider.getBlockNumber();
                if (blockNumber > latestBlock) {
                    selectedBlock.innerHTML = `<p class="muted">Block ${blockNumber} does not exist. Latest block is ${latestBlock}.</p>`;
                    return;
                }

                renderBlock(await provider.getBlock(blockNumber), selectedBlock);
            } catch (error) {
                console.error(error);
                selectedBlock.innerHTML = '<p class="muted">Could not read this block. Is Anvil running?</p>';
            }
        }


        async function loadAllBlocks() {
            const blockList = document.getElementById("block-list");
            const summary = document.getElementById("block-summary");
            blockList.innerHTML = '<p class="muted">Loading blocks...</p>';

            try {
                const latestBlock = await provider.getBlockNumber();
                const blockNumbers = Array.from(
                    { length: latestBlock + 1 },
                    (_, index) => index
                );
                const blocks = await Promise.all(
                    blockNumbers.map((blockNumber) => provider.getBlock(blockNumber))
                );

                summary.innerText = `Showing ${blocks.length} block${blocks.length === 1 ? "" : "s"} (0-${latestBlock})`;
                blockList.innerHTML = blocks.map((block) => `
                    <article class="block">
                        <h3>Block #${block.number}</h3>
                        <p><strong>Hash:</strong> ${block.hash}</p>
                        <p><strong>Parent hash:</strong> ${block.parentHash}</p>
                        <p><strong>Timestamp:</strong> ${formatTimestamp(block.timestamp)}</p>
                        <p><strong>Transactions:</strong> ${block.transactions.length}</p>
                    </article>
                `).join("");
            } catch (error) {
                console.error(error);
                summary.innerText = "Could not connect to the local blockchain";
                blockList.innerHTML = '<p class="muted">Start Anvil at http://127.0.0.1:8545 and refresh this page.</p>';
            }
        }


        // ------------------------------------------------
        // BUTTONS
        // ------------------------------------------------

        document.getElementById("connect")
            .onclick = connectWallet;


        document.getElementById("increment")
            .onclick = incrementCounter;


        document.getElementById("refresh")
            .onclick = getCounter;


        document.getElementById("view-block")
            .onclick = viewBlockByNumber;


        document.getElementById("view-all-blocks")
            .onclick = loadAllBlocks;


        // Load counter immediately
        getCounter();
        loadAllBlocks();

    </script>

</body>
</html>
